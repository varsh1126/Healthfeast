version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: healthfeast_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthfeast_db
      POSTGRES_USER: healthfeast_user
      POSTGRES_PASSWORD: healthfeast_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthfeast_user -d healthfeast_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthfeast_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "production-secret-docker-compose-healthfeast-key"
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: "postgresql://healthfeast_user:healthfeast_pass@db:5432/healthfeast_db"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "gemini-3.8-flash"
      DEMO_MODE: "True"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthfeast_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
