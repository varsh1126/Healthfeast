services:
  - type: web
    name: healthfeast-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn healthfeast.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healthfeast-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DEMO_MODE
        value: "True"
      - key: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: healthfeast-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://healthfeast-backend.onrender.com/api

databases:
  - name: healthfeast-postgres
    region: oregon
    plan: free
    databaseName: healthfeast_db
    user: healthfeast_user
